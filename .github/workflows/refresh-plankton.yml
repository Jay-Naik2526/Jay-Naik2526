name: Refresh plankton count

# Rebuilds assets/plankton.svg (the glowing contribution grid) every night.
# Your existing snake workflow is untouched; this one only writes one file.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the contribution grid
        run: node scripts/build.mjs --only=plankton
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if it changed
        run: |
          git config user.name "plankton-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/plankton.svg assets/.contributions.json
          git diff --cached --quiet || (git commit -m "chore: refresh plankton count" && git push)
